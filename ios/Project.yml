name: TodoNative
options:
  createIntermediateGroups: true

fileGroups:
  - TodoNative/Configuration/TodoNative.storekit

settings:
  base:
    SWIFT_VERSION: "5.10"
    SWIFT_STRICT_CONCURRENCY: "complete"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    PRODUCT_BUNDLE_IDENTIFIER: com.zhili.todo-native
    DEVELOPMENT_TEAM: 3VTA6Z7UCM

targets:
  TodoNative:
    platform: iOS
    type: application
    deploymentTarget: "17.0"
    info:
      path: TodoNative/Info.plist
      properties:
        CFBundleDisplayName: "AI Native Todo"
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSMicrophoneUsageDescription: "Use the microphone to dictate tasks and messages to your AI companion."
        NSSpeechRecognitionUsageDescription: "Convert your speech to text for tasks and conversations with your AI companion."
        AIConsentVersion: "1"
        PrivacyPolicyURL: "https://todo-list-app.zhili1993.chatgpt.site/privacy.html"
        TermsOfUseURL: "https://todo-list-app.zhili1993.chatgpt.site/terms.html"
        SupportURL: "https://todo-list-app.zhili1993.chatgpt.site/support.html"
        UIApplicationSupportsIndirectInputEvents: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UILaunchScreen: {}
    sources:
      - path: TodoNative
        excludes:
          - Configuration/TodoNative.storekit
    resources:
      - path: TodoNative/Assets.xcassets
      - path: TodoNative/PrivacyInfo.xcprivacy
      - path: TodoNative/Resources
    settings:
      base:
        GENERATE_INFOPLIST_FILE: NO
    scheme:
      storeKitConfiguration: TodoNative/Configuration/TodoNative.storekit
      testTargets:
        - TodoNativeTests

  TodoNativeTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: TodoNativeTests
    dependencies:
      - target: TodoNative
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.zhili.todo-native.tests
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/TodoNative.app/TodoNative"
        BUNDLE_LOADER: "$(TEST_HOST)"
